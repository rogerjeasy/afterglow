[project]
name = "afterglow-crew-backend"
version = "0.1.0"
description = "Afterglow night watch: the deterministic engine and signed-proxy backend of the Afterglow Crew app."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
