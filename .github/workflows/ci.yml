name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, property suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Properties are the definition of done (AGENTS.md).
      - run: pnpm test
      # ADR-002: the same property suite in a real browser engine.
      - run: pnpm --filter @afterglow/core exec playwright install --with-deps chromium
      - run: pnpm --filter @afterglow/core test:browser
      - run: pnpm build

  pixel-scan:
    name: Night Shell pixel scan (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/mobile
      # NS-10/11: every route, every mode and the outage state, painted by a real browser.
      - run: pnpm e2e
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pixel-scan-results
          path: apps/mobile/test-results
