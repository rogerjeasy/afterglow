name: Deploy PWA to GitHub Pages

# Hosts the web build of apps/mobile. MANUAL ONLY for now: the repository is
# private, and GitHub Pages for a private repository needs a paid plan. Run it
# from the Actions tab once Pages is enabled (Settings -> Pages -> Source:
# "GitHub Actions"), or switch to another host. Do not re-add a push trigger
# until Pages is available, or every push shows a failed run.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build
        run: pnpm --filter @afterglow/mobile build
        env:
          AFTERGLOW_BASE: /${{ github.event.repository.name }}/
      # Single-page app fallback so deep links (?phase=outage) keep working.
      - run: cp apps/mobile/dist/index.html apps/mobile/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
