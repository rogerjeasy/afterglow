name: Deploy PWA to GitHub Pages

# Hosts the web build of apps/mobile. Triggered on main, or manually. The
# repository must be public (or on a plan with Pages for private repos) and
# Pages must be set to "GitHub Actions" in Settings -> Pages.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'data/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build
        run: pnpm --filter @afterglow/mobile build
        env:
          AFTERGLOW_BASE: /${{ github.event.repository.name }}/
      # Single-page app fallback so deep links (?phase=outage) keep working.
      - run: cp apps/mobile/dist/index.html apps/mobile/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
